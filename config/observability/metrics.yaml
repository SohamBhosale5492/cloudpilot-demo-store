# cloudpilot:metrics
metrics:
  - name: store_http_requests_total
    service: api-gateway
    route: /api/products
    method: GET
    labels:
      service: api-gateway
      route: /api/products
      method: GET
  - name: store_product_views_total
    service: product-service
    route: /products
    method: GET
    labels:
      service: product-service
      route: /products
      method: GET
  - name: store_http_requests_total
    service: order-service
    route: /orders
    method: POST
    labels:
      service: order-service
      route: /orders
      method: POST
  - name: store_orders_placed_total
    service: order-service
    route: /orders
    method: POST
    labels:
      service: order-service
      route: /orders
      method: POST
    # cloudpilot:remediated:CP-RULE-OBS-GAP-METRIC-PRESENT

# The order placement counter is enabled only when its order-service entry is
# declared above. CloudPilot evaluates its absence until an approved patch adds it.
