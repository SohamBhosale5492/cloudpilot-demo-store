# cloudpilot:alerts
groups:
  - name: store_alerts
    rules:
      - alert: store_gateway_high_error_rate
        expr: rate(store_http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
          requirement_id: store-gateway-error-alert
        annotations:
          summary: "API Gateway 5xx error rate exceeds 5%"
      - alert: store_product_service_down
        expr: up{job="product-service"} == 0
        for: 30s
        labels:
          severity: warning
          requirement_id: store-product-down-alert
        annotations:
          summary: "Product Service target is down"
  - name: cloudpilot_alerts
    rules:
      - alert: store_order_service_heartbeat_alert
        expr: up{job="order-service"} == 0
        for: 1m
        labels:
          severity: warning
          requirement_id: store_order_service_heartbeat_alert
        annotations:
          summary: "Order Service target is down"
        # cloudpilot:remediated:CP-RULE-OBS-GAP-ALERT-UNCONFIGURED
