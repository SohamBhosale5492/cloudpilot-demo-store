name: Demo Store validation

on: [pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm
          -v "$PWD/config/observability:/rules:ro"
          --entrypoint promtool
          prom/prometheus:v2.51.0
          check rules /rules/alert-rules.yaml
